# Immich, wired so PhotoVault can archive what it ingests.
#
# Immich is the capture and browsing layer: the mobile app has proper
# background upload on both iOS and Android, and its "free up space" clears
# the phone. PhotoVault is the archival layer: replication across drives,
# integrity scrubbing, disaster recovery. They do not overlap, and Immich's
# own backup story is "back this up yourself" - which is the hole PhotoVault
# fills.
#
# Two rules that matter:
#
#   1. UPLOAD_LOCATION must NOT be PhotoVault's primary library. Both systems
#      write to their own trees; pointing them at one directory means
#      PhotoVault's reconcile fights Immich's deletions by re-pushing files
#      Immich deliberately removed.
#
#   2. Pin IMMICH_VERSION. Immich ships roughly every 3-4 days. You are running
#      an archive, not a lab - update deliberately, after reading the release
#      notes for migrations.

name: immich

services:
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION}
    volumes:
      - ${UPLOAD_LOCATION}:/usr/src/app/upload
      # PhotoVault's library, mounted READ-ONLY as an external library. Immich
      # indexes it in place - no second copy of 57 GB, and the :ro flag means
      # Immich physically cannot delete your archive, even from its own UI.
      # The container path is what you type into Immich, not the host path.
      - ${PHOTOVAULT_LIBRARY}:/mnt/photovault:ro
    environment:
      TZ: ${TZ:-UTC}
    env_file: [.env]
    ports:
      - 127.0.0.1:2283:2283      # loopback only; reach it over SSH if remote
    depends_on: [redis, database]
    restart: unless-stopped
    healthcheck:
      disable: false

  immich-machine-learning:
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION}
    volumes:
      - model-cache:/cache
    environment:
      TZ: ${TZ:-UTC}
    env_file: [.env]
    restart: unless-stopped

  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:8-bookworm
    healthcheck:
      test: redis-cli ping || exit 1
    restart: unless-stopped

  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
      TZ: ${TZ:-UTC}
    volumes:
      # A named Docker volume, NOT a host bind mount. Immich's own guidance is
      # that the database "should ideally use local SSD storage, and never a
      # network share of any kind" - and on Colima a host mount is exactly that
      # (sshfs, or virtiofs at best). A named volume lives on the VM's own ext4
      # disk, which is the local SSD Postgres wants.
      #
      # The trade: `colima delete` destroys it. That is what pg_dump backups are
      # for - and the photos were never in here anyway.
      - immich-db:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  model-cache:
  immich-db:
